name: Build Stash

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── 2. Go toolchain ────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── 3. pnpm (version read from packageManager field in package.json) ───
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/v2.5/package.json

      # ── 4. Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: ui/v2.5/pnpm-lock.yaml

      # ── 5. Install frontend dependencies ───────────────────────────────────
      - name: Install UI dependencies
        working-directory: ui/v2.5
        run: pnpm install --frozen-lockfile

      # ── 6. Generate — runs both generate-backend (go generate ./cmd/stash)
      #        and generate-ui (pnpm gqlgen). This produces:
      #          • internal/api/generated_exec.go
      #          • internal/api/generated_models.go
      #          • ui/v2.5/src/core/generated-graphql.ts
      # ───────────────────────────────────────────────────────────────────────
      - name: Generate (backend + frontend GraphQL types)
        run: make generate

      # ── 7. Build UI (pnpm build + login locale embed → ui/v2.5/build/) ─────
      - name: Build UI
        run: make ui

      # ── 8. Build Go binary (CGO_ENABLED=1 required for go-sqlite3) ─────────
      - name: Build backend
        env:
          CGO_ENABLED: "1"
        run: go build -o stash ./cmd/stash/

      # ── 9. Upload binary so you can download and test it ───────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stash-linux
          path: stash
          retention-days: 7
