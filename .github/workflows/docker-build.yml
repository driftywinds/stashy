name: Build and Push Docker Image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag(s) to push — comma-separated (e.g. latest,v0.1.1)"
        required: true
        default: "latest"
      release_tag:
        description: "GitHub release tag to pull binaries from (e.g. latest_develop, v0.27.0)"
        required: true
        default: "latest_develop"
jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            IMAGE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi

          # Prefix every comma-separated tag with the full registry path
          FULL_TAGS=""
          IFS=',' read -ra TAGS <<< "$IMAGE_TAG"
          for tag in "${TAGS[@]}"; do
            tag="${tag// /}"  # trim whitespace
            FULL_TAGS="${FULL_TAGS}ghcr.io/driftywinds/stashy:${tag}"$'\n'
          done

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "full_tags<<EOF"
            printf '%s' "$FULL_TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Using release: $RELEASE_TAG → image tags:"$'\n'"$FULL_TAGS"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            RELEASE_TAG=${{ steps.tags.outputs.release_tag }}
          tags: ${{ steps.tags.outputs.full_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/driftywinds/stashy
            org.opencontainers.image.description=Stashy - media server
            org.opencontainers.image.revision=${{ github.sha }}