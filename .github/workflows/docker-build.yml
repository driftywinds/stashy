name: Build and Push Docker Image

on:
  # Trigger automatically whenever a new release is published
  release:
    types: [published]

  # Manual trigger — lets you choose tags and which release to pull binaries from
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to push (e.g. latest, v0.27.0, dev)"
        required: true
        default: "latest"
      release_tag:
        description: "GitHub release tag to pull binaries from (e.g. latest_develop, v0.27.0)"
        required: true
        default: "latest_develop"

jobs:
  docker:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      # ── 1. Checkout (Dockerfile lives in docker/) ───────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Work out which release tag and image tag to use ──────────────
      # On a release event, derive both from the Git tag.
      # On a manual dispatch, use whatever the user typed.
      - name: Resolve tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            IMAGE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"     >> "$GITHUB_OUTPUT"
          echo "Using release: $RELEASE_TAG → image tag: $IMAGE_TAG"

      # ── 3. Log in to GitHub Container Registry ──────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Set up QEMU for cross-platform emulation ─────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 5. Set up Docker Buildx ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 6. Build and push multi-platform image ──────────────────────────
      # Downloads the right binary per platform inside the Dockerfile using
      # TARGETPLATFORM, so no cross-compiling is done here.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker              # folder containing the Dockerfile
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            RELEASE_TAG=${{ steps.tags.outputs.release_tag }}
          tags: |
            ghcr.io/driftywinds/stashy:${{ steps.tags.outputs.image_tag }}
          # Always also tag with 'latest' on a release event
          # On manual runs, only push whatever the user specified
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/driftywinds/stashy
            org.opencontainers.image.description=Stashy - media server
            org.opencontainers.image.revision=${{ github.sha }}